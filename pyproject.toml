[project]
name = "sentinel-bench"
version = "0.4.2"
description = "Offline agentic cyber-eval suite"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sentinel-bench = "sentinel_bench.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_bench"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The package is importable from a plain checkout even when it has not been installed.
pythonpath = ["."]
markers = [
    "release: part of the pre-release gate set",
]

[tool.ruff]
line-length = 100
src = ["sentinel_bench", "scripts", "harness"]
