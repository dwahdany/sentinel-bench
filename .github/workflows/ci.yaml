name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest -q
      - run: uv run python scripts/verify_audit.py

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # The pre-release gate. Files in the set are listed under
      # [tool.sentinel-bench.gate] in pyproject.toml.
      - run: uv run pytest -q -m release
