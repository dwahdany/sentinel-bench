# Vendor API keys, one per team member, injected from the secret store at deploy time.
# The vendor's terms bind these to one client per key; sentinel_bench.client sends one
# user agent and does not pretend to be more clients than it is.
[vendor]
base_url = "https://api.vendor.example/v1"
rate_limit_rpm = 600
terms = "https://vendor.example/terms#rate-limits"

[[vendor.keys]]
owner = "priya@example.invalid"
key = "sk-PLACEHOLDER-NOT-A-REAL-KEY-01"

